# Railway service for the Slipway backend. The frontend deploys to Vercel.
# Add a volume mounted at /data in the Railway dashboard before first deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "packages/**", "pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

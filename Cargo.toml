[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/slipwaykit/slipway"

[workspace.dependencies]
soroban-sdk = "27.0.6"

# The profile Soroban recommends: small, deterministic wasm with overflow checks
# kept on, because silently wrapping an i128 amount is worse than aborting.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
